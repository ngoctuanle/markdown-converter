[package]
name = "markdown-converter"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.9.1", features = ["tree-sitter-markdown"] }
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wait-timeout = "0.2"
deunicode = "1.6"
dirs = "6"
regex = "1"
anyhow = "1"

[dev-dependencies]
gpui-kit = { version = "0.9.1", features = ["test-support", "tree-sitter-markdown"] }

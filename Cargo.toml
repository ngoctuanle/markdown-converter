[package]
name = "markdown-converter"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.9.1", features = ["tree-sitter-markdown"] }
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
wait-timeout = "0.2"
deunicode = "1.6"
dirs = "6"
regex = "1"
anyhow = "1"
base64 = "0.22"

[dev-dependencies]
gpui-kit = { version = "0.9.1", features = ["test-support", "tree-sitter-markdown"] }

[package.metadata.packager]
product-name = "Markdown Converter"
identifier = "app.markdown-converter"
before-packaging-command = "cargo build --release"
out-dir = "dist"
formats = ["app", "dmg", "nsis", "deb", "appimage"]
resources = [
  { src = "vendor/pandoc/current/pandoc*", target = "." },
  { src = "vendor/pandoc/current/COPYING.md", target = "pandoc-COPYING.md" },
  "THIRD_PARTY_NOTICES.md",
]
